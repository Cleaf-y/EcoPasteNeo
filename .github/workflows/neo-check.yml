name: Neo Check

"on":
  pull_request:
    paths:
      - crates/**
      - migrations/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/neo-check.yml
  push:
    branches:
      - feat/**
    paths:
      - crates/**
      - migrations/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/neo-check.yml
  workflow_dispatch:

jobs:
  check:
    name: Neo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p ecopaste-neo-app -p ecopaste-neo-core --all-targets --all-features --locked -- -D warnings

      - name: Test core
        run: cargo test -p ecopaste-neo-core --all-features --locked

      - name: Test app
        run: cargo test -p ecopaste-neo-app --locked

      - name: Test embedded Windows debug shaders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $messages = cargo test -p gpui-pre-windows --lib --no-run --locked --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Shader test build failed' }
          $artifacts = @($messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'gpui_windows' -and $_.profile.test -and $_.executable
          })
          if ($artifacts.Count -ne 1) { throw 'Expected one Windows shader test executable' }
          $testName = 'directx_renderer::shader_resources::tests::embedded_debug_shaders_compile'
          $tests = & $artifacts[0].executable --list
          if ($LASTEXITCODE -ne 0 -or -not ($tests -contains "${testName}: test")) {
            throw 'Embedded shader regression test is missing'
          }
          $shaders = @('shaders.hlsl', 'alpha_correction.hlsl') | ForEach-Object {
            Join-Path $PWD "vendor/gpui-pre-windows/src/$_"
          }
          foreach ($shader in $shaders) {
            if (-not (Test-Path -LiteralPath $shader) -or (Test-Path -LiteralPath "$shader.portability-check")) {
              throw "Cannot isolate shader source: $shader"
            }
          }
          try {
            foreach ($shader in $shaders) {
              Move-Item -LiteralPath $shader -Destination "$shader.portability-check"
            }
            & $artifacts[0].executable --exact $testName --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Embedded shader test failed without source files' }
          } finally {
            foreach ($shader in $shaders) {
              if (Test-Path -LiteralPath "$shader.portability-check") {
                Move-Item -LiteralPath "$shader.portability-check" -Destination $shader
              }
            }
          }

      - name: Test hidden Windows initial placement
        if: runner.os == 'Windows'
        run: cargo test -p gpui-pre-windows --lib initial_placement_keeps_requested_bounds_without_showing --locked

      # Debug builds compile embedded GPUI shaders at runtime, so no Windows SDK shader compiler is needed.
      - name: Build Windows debug executable
        if: runner.os == 'Windows'
        run: cargo build -p ecopaste-neo-app --bin EcoPasteNeo --locked

      - name: Upload Windows debug executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EcoPasteNeo-windows-debug
          path: target/debug/EcoPasteNeo.exe
