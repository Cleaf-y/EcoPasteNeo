[package]
name = "ecopaste-neo-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
sqlx = ["dep:sqlx"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "macros"], optional = true }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
